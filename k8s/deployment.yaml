apiVersion: apps/v1
kind: Deployment
metadata:
  name: yoga-app
  namespace: yoga-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yoga-app
  template:
    metadata:
      labels:
        app: yoga-app
    spec:
      containers:
        - name: yoga-app
          image: ghcr.io/YOUR_GITHUB_USERNAME/yoga-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: yoga-app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
