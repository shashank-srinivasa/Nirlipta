events {}

http {
  server {
    listen 8000;

    # PostgREST REST API — Supabase client calls /rest/v1/*
    location /rest/v1/ {
      proxy_pass http://postgrest:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Stub auth endpoints so Supabase JS client doesn't crash on init
    location /auth/v1/ {
      return 200 '{"access_token":"","token_type":"bearer","user":null}';
      add_header Content-Type application/json;
    }

    # Health check
    location /health {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}
